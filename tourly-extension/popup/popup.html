<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #ffffff; color: #1c1e24; }
    .wrap { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    h1 span { color: #4E5FFD; }
    p { margin: 0 0 12px; color: #6b7280; }
    button.primary { width: 100%; background: #4E5FFD; border: 0; color: #fff; border-radius: 8px; padding: 10px; font: 600 13px system-ui; cursor: pointer; }
    button.primary:hover { background: #3f50ee; }
    .status { margin-top: 8px; color: #8a90a0; font-size: 12px; min-height: 14px; }
    .sec { margin-top: 14px; border-top: 1px solid #eef0f3; padding-top: 12px; }
    .sec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: #8a90a0; margin: 0 0 8px; }
    .link { color: #4E5FFD; cursor: pointer; font-size: 12px; }
    .tours { margin-top: 8px; }
    .tour { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f1f4; border-radius: 4px; }
    .tour.tour-clickable { cursor: pointer; margin: 0 -4px; padding: 6px 4px; }
    .tour.tour-clickable:hover { background: #f3f4ff; }
    .tour b { font-weight: 600; display: block; }
    .tour small { color: #8a90a0; }
    .tour .tour-url { color: #4E5FFD; }
    .muted { color: #8a90a0; font-size: 12px; }
    .sync-ok { color: #0a7d53; }
    .sync-err { color: #c0392b; }

    .acct-badge { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-weight: 600; margin-bottom: 8px; }
    .acct-badge .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .acct-badge.is-signedin { background: #e8f7f0; color: #0a7d53; }
    .acct-badge.is-signedin .dot { background: #0a7d53; }
    .acct-badge.is-anon { background: #f3f4f7; color: #4b5262; }
    .acct-badge.is-anon .dot { background: #9aa0ac; }
    .acct-badge-email { word-break: break-all; }
    .acct-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .acct-email { font-weight: 600; word-break: break-all; }
    .acct-actions { display: flex; gap: 10px; margin-top: 6px; }
    button.secondary { background: #f3f4f7; border: 1px solid #dfe3ea; color: #1c1e24; border-radius: 6px; padding: 7px 10px; font: 600 12px system-ui; cursor: pointer; white-space: nowrap; }
    button.secondary:hover { background: #e9ebf1; }
    button.secondary:disabled { opacity: .5; cursor: default; }
    .acct-hint { color: #8a90a0; font-size: 11px; margin-top: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tour<span>ly</span> Editor</h1>
    <p>Open the timeline editor on the current page to build or edit its tour.</p>
    <button class="primary" id="open">Open editor on this page</button>
    <div class="status" id="status"></div>

    <div class="sec">
      <h2>My tours <span class="link" id="refresh">refresh</span></h2>
      <div class="tours" id="tours"><span class="muted">Loading…</span></div>
    </div>

    <div class="sec">
      <h2>Account</h2>

      <!-- Always-visible, single source of truth for signed-in vs anonymous — never ambiguous. -->
      <div id="acctBadge" class="acct-badge is-anon">
        <span class="dot"></span>
        <span id="acctBadgeText">Checking…</span>
      </div>

      <!-- anonymous: entry points into Flow A (add email) or Flow B (sign in elsewhere) -->
      <div id="acctAnon" class="hidden">
        <div class="acct-actions">
          <span class="link" id="showAddEmail">Add email to back up your tours</span>
        </div>
        <div class="acct-actions">
          <span class="link" id="showSignIn">Sign in to an existing account</span>
        </div>
      </div>

      <!-- signed in: badge above already shows the email; just the sign-out action here -->
      <div id="acctSignedIn" class="hidden">
        <button class="secondary" id="signOut">Sign out</button>
      </div>

      <div id="syncStatus" class="acct-hint">Checking…</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
