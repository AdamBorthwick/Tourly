<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tourly — Player.js × vidzflow spike</title>
  <!-- Player.js: the same protocol vidzflow's embed page implements (embed.ly player-0.1.0) -->
  <script src="https://cdn.embed.ly/player-0.1.0.min.js"></script>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background:#0e0f13; color:#e6e7eb; }
    header { padding:12px 16px; background:#171922; border-bottom:1px solid #262a36; }
    h1 { font-size:15px; margin:0; font-weight:600; }
    .wrap { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px; }
    iframe { width:360px; height:203px; border:0; border-radius:8px; background:#000; }
    .controls button { background:#2a2f3d; color:#e6e7eb; border:1px solid #3a4152; border-radius:6px; padding:6px 10px; margin:2px; cursor:pointer; }
    .controls button:hover { background:#333a4c; }
    .stat { margin:8px 0; }
    .stat b { color:#9aa4bd; font-weight:500; }
    #log { background:#0a0b0e; border:1px solid #262a36; border-radius:8px; padding:10px; height:60vh; overflow:auto; white-space:pre-wrap; font-family:ui-monospace, monospace; font-size:12px; }
    .ok { color:#5fd08a; } .warn { color:#f0c674; } .err { color:#ff7b72; } .dim{color:#6b7280;}
    #verdict { padding:8px 16px; font-weight:600; }
  </style>
</head>
<body>
  <header><h1>Tourly — Player.js × vidzflow spike</h1></header>
  <div id="verdict" class="dim">Waiting for player "ready"…</div>
  <div class="wrap">
    <div>
      <iframe
        id="vidzflow"
        src="https://app.vidzflow.com/v/bLyM50Ijrd?dq=576&ap=false&muted=true&loop=false&ctp=false&bv=false&piv=false&playsinline=true&bc=%234E5FFD&controls=true"
        allow="autoplay; fullscreen"
        allowfullscreen></iframe>
      <div class="controls">
        <button data-act="play">play()</button>
        <button data-act="pause">pause()</button>
        <button data-act="getCurrentTime">getCurrentTime()</button>
        <button data-act="getDuration">getDuration()</button>
        <button data-act="seek5">setCurrentTime(5)</button>
        <button data-act="seek15">setCurrentTime(15)</button>
        <button data-act="clear">clear log</button>
      </div>
      <div class="stat"><b>currentTime (dead-reckoned):</b> <span id="dr">–</span></div>
      <div class="stat"><b>last timeupdate:</b> <span id="tu">–</span></div>
      <div class="stat"><b>duration:</b> <span id="dur">–</span></div>
    </div>
    <div id="log"></div>
  </div>

  <script>
    var logEl = document.getElementById('log');
    var verdictEl = document.getElementById('verdict');
    function log(cls, msg) {
      var t = new Date().toISOString().substr(11, 12);
      var line = document.createElement('div');
      line.className = cls || '';
      line.textContent = '[' + t + '] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    if (typeof playerjs === 'undefined') {
      log('err', 'playerjs global NOT loaded — CDN blocked?');
      verdictEl.textContent = 'FAIL: playerjs library did not load';
      verdictEl.className = 'err';
    } else {
      log('ok', 'playerjs library loaded. Constructing Player…');
    }

    // Dead-reckoning clock state
    var anchorSeconds = 0, anchorNow = performance.now(), playing = false, gotTimeupdate = false;
    function drNow() {
      if (!playing) return anchorSeconds;
      return anchorSeconds + (performance.now() - anchorNow) / 1000;
    }
    setInterval(function () {
      document.getElementById('dr').textContent = drNow().toFixed(3) + 's';
    }, 50);

    var player;
    try {
      player = new playerjs.Player('vidzflow');
    } catch (e) {
      log('err', 'Player construction threw: ' + e.message);
    }

    var readyFired = false;
    var readyTimeout = setTimeout(function () {
      if (!readyFired) {
        log('err', 'No "ready" within 8s — vidzflow iframe may not implement the Player.js receiver.');
        verdictEl.textContent = 'FAIL: no Player.js ready event (fallback to direct MP4 needed)';
        verdictEl.className = 'err';
      }
    }, 8000);

    if (player) {
      player.on('ready', function () {
        readyFired = true;
        clearTimeout(readyTimeout);
        log('ok', 'READY ✓ — Player.js receiver is live on the vidzflow iframe.');
        verdictEl.textContent = 'PASS (partial): ready received — testing events & methods…';
        verdictEl.className = 'warn';

        player.on('timeupdate', function (d) {
          gotTimeupdate = true;
          anchorSeconds = d.seconds; anchorNow = performance.now();
          document.getElementById('tu').textContent = d.seconds.toFixed(3) + 's / dur ' + (d.duration||'?');
          if (d.duration) document.getElementById('dur').textContent = d.duration.toFixed(2) + 's';
          evaluate();
        });
        player.on('play',  function () { playing = true;  log('ok', 'event: play'); });
        player.on('pause', function () { playing = false; anchorSeconds = drNow(); log('warn', 'event: pause'); });
        player.on('ended', function () { playing = false; log('warn', 'event: ended'); });
        player.on('seeked', function (d) {
          if (d && typeof d.seconds === 'number') { anchorSeconds = d.seconds; anchorNow = performance.now(); }
          log('ok', 'event: seeked ' + (d && d.seconds != null ? d.seconds.toFixed(2)+'s' : ''));
        });

        player.getDuration(function (dur) { log('ok', 'getDuration() → ' + dur); document.getElementById('dur').textContent = dur + 's'; });
        player.getCurrentTime(function (t) { log('ok', 'getCurrentTime() → ' + t); });
      });
    }

    var evaluated = false;
    function evaluate() {
      if (evaluated || !gotTimeupdate) return;
      evaluated = true;
      log('ok', 'timeupdate events flowing ✓ — dead-reckoning clock is tracking.');
      verdictEl.textContent = 'PASS ✓ — Player.js gives ready + timeupdate. Scroll-sync is viable via vidzflow iframe.';
      verdictEl.className = 'ok';
    }

    document.querySelector('.controls').addEventListener('click', function (e) {
      var act = e.target.getAttribute('data-act');
      if (!act || !player) return;
      switch (act) {
        case 'play': player.play(); log('dim', 'called play()'); break;
        case 'pause': player.pause(); log('dim', 'called pause()'); break;
        case 'getCurrentTime': player.getCurrentTime(function (t) { log('ok', 'getCurrentTime() → ' + t); }); break;
        case 'getDuration': player.getDuration(function (d) { log('ok', 'getDuration() → ' + d); }); break;
        case 'seek5': player.setCurrentTime(5); log('dim', 'called setCurrentTime(5)'); break;
        case 'seek15': player.setCurrentTime(15); log('dim', 'called setCurrentTime(15)'); break;
        case 'clear': logEl.innerHTML = ''; break;
      }
    });
  </script>
</body>
</html>
